name: vllm-rocm-main

networks:
  backend:
    external: true
  gpu-node-net:
    external: true

services:
  vllm-35b-awq-main:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROCM_BASE: rocm/dev-ubuntu-24.04:7.14.0-full@sha256:439edaa8f0c4be4a3728e528f87b8a2ea1f051f34cf10b27caa4bd94f562eda7
        TORCH_COMMIT: cf30153c4c131c8164ee7798e5022d810682e2cb
        VLLM_COMMIT: d4da0c55af3aa231b6209bf77871f3ed36eab0d2
    image: vllm-35b-awq-main:source
    container_name: vllm-35b-awq-main
    restart: unless-stopped
    user: root
    ipc: host
    shm_size: 16G
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    privileged: true
    networks:
      - backend
      - gpu-node-net
    ports:
      - "13313:13313"
    environment:
      TZ: UTC
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      HSA_SIGNAL_TIMEOUT: "-1"
      AMDGPU_GPU_RECOVERY: "1"
      ROCR_VISIBLE_DEVICES: "0,1"
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_API_KEY: "${VLLM_35B_API_KEY:-}"
      NCCL_P2P_DISABLE: "1"
      NCCL_DEBUG: INFO
      NCCL_PROTO: Simple
      GPU_MAX_HW_QUEUES: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_LOGGING_LEVEL: INFO
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
      HF_HOME: /root/.cache/huggingface
      TRITON_CACHE_DIR: /root/.triton
      VLLM_CACHE_ROOT: /root/.cache/vllm
    command:
      - --model
      - sahilchachra/Qwen3.6-35B-A3B-uncensored-heretic-AWQ
      - --served-model-name
      - sahilchachra/Qwen3.6-35B-A3B-uncensored-heretic-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "13313"
      - --tensor-parallel-size
      - "2"
      - --pipeline-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.92"
      - --quantization
      - compressed-tensors
      - --max-model-len
      - "65536"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "8192"
      - --dtype
      - bfloat16
      - --language-model-only
      - --enforce-eager
      - --reasoning-parser
      - qwen3
      - --load-format
      - safetensors
      - --safetensors-load-strategy
      - lazy
    volumes:
      - /home/[username]/docker/lemonade-tq/data/cache:/root/.cache/huggingface:ro
      - ./data/triton-cache:/root/.triton:rw
      - ./data/vllm-cache:/root/.cache/vllm:rw
    group_add:
      - video
      - "105"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13313/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: vllm-35b-awq-main
