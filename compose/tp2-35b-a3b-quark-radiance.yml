# TP=2 vLLM Service — Qwen3.6-27B-Quark-W8A8-INT8 on vllm-radiance:gfx1100
# Swaps the lemonade-tq image in place on :13313. gfx1100 (RDNA3) adaptation:
#   - AITER: GEMM (linear) via Triton gemm_a8w8 (aiter#4604 port); unified-attn/MHA/MLA/MoE off first boot
#   - fp8 paths off (RDNA3 has no native fp8): preshuffle, fuse-rms-quant, AR quant, vit flash
#   - MTP self-spec + dynamic draft (radiance), GDN prefix caching (--mamba-cache-mode=align)
# Model: nameistoken/Qwen3.6-35B-A3B-Quark-W8A8-INT8 (36.7 GB, Quark W8A8 INT8, MoE 3B active)
# Entrypoint: radiance_entrypoint.sh -> exec vllm serve "$@" (command: supplies args)
networks:
  backend:
    external: true
  big-chungus-net:
    external: true

services:
  vllm-35b-quark:
    image: vllm-radiance:gfx1100
    restart: unless-stopped
    container_name: vllm-35b-quark
    user: root
    ipc: host
    shm_size: 16G
    privileged: true
    security_opt:
      - seccomp=unconfined
    networks:
      - backend
      - big-chungus-net
    ports:
      - "13313:13313"
    command:
      - "nameistoken/Qwen3.6-35B-A3B-Quark-W8A8-INT8"
      - --served-model-name=vllm-35b
      - --quantization=quark
      - --tensor-parallel-size=2
      - --gpu-memory-utilization=0.85
      - --max-model-len=32768
      - --max-num-batched-tokens=2048
      - --max-num-seqs=64
      - --dtype=bfloat16
      - --attention-backend=ROCM_ATTN
      # GDN hybrid prefix caching (radiance-verified for this model family)
      - --enable-prefix-caching
      # eager-draft pass: cap CUDA graph capture at 128 tokens (drafter+model buckets),
      # bigger batches fall back to eager — keeps graph pools small enough for 24 GiB
      - '--compilation-config={"cudagraph_capture_sizes":[1,2,4,8,16,32,64,128],"max_cudagraph_capture_size":128}'
      # MTP measured: 19.3 vs 19.5 t/s (no win on Quark-W8A8; draft acceptance low) — disabled
      - --no-async-scheduling
      # agentic serving
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - --language-model-only
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=13313
    environment:
      HIP_VISIBLE_DEVICES: "0,1"
      TZ: America/Chicago
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      # AITER: enabled; GEMM (linear) is the gfx1100 Triton path. Attention stays stock ROCM_ATTN
      # (unified-attn is gfx1201-tuned; iterate after a working baseline).
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_LINEAR: "1"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_MLA: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "0"
      VLLM_ROCM_USE_AITER_RMSNORM: "0"
      # gfx1100 tuning (radiance defaults; fp8 paths explicitly off)
      RADIANCE_GDN_WMMA: "0"
      RADIANCE_MOE_ROUTER: "1"
      RADIANCE_DYNAMIC_DRAFT: "1"
      RADIANCE_FAST_REDUCE: "0"
      RADIANCE_RUN_BWTEST: "0"
      RADIANCE_AR_QUANT: "0"
      RADIANCE_PRESHUFFLE: "0"
      RADIANCE_FUSE_RMS_QUANT: "0"
      RADIANCE_VIT_FLASH: "0"
      # PCIe P2P (TRX50 WS, IOMMU off) + gfx1100 scheduler quirk
      NCCL_PROTO: Simple
      GPU_MAX_HW_QUEUES: "1"
      # compile throttle (radiance default; defensive)
      TORCHINDUCTOR_COMPILE_THREADS: "4"
      # persistent compile caches -> fast warm restarts
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      AITER_ROOT_DIR: /cache/aiter
    volumes:
      # HF weights (nameistoken/Qwen3.6-35B-A3B-Quark-W8A8-INT8; download on first boot)
      - ./data/cache:/root/.cache/huggingface:rw
      # fresh compile cache (old lemonade-era caches are poisoned — start clean)
      - ./data/radiance-cache-35b-a3b-quark:/cache:rw

    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:13313/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: vllm-35b-quark
