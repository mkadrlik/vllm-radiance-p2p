name: Mirror to GitHub and Push to ghcr.io

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror-to-github:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.local"

      - name: Add GitHub remote
        run: |
          git remote add github https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/vllm-radiance-p2p.git

      - name: Mirror to GitHub (excluding .gitea folder)
        run: |
          # Delete .gitea folder from git history before pushing
          git filter-branch -f --prune-empty --index-filter 'git rm -rf --cached --ignore-unmatch .gitea' HEAD 2>/dev/null || true
          # Push all refs to GitHub
          git push github --force --all
          git push github --force --tags

  build-and-push:
    runs-on: [self-hosted:host, linux:host, amd64:host]
    needs: mirror-to-github
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vllm-radiance-p2p

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
