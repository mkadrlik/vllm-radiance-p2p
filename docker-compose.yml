# vLLM inference on AMD RDNA3 (gfx1100)
#
# One profile at a time — all share port 13313 (radiance) or 13309 (awq).
#
#   radiance-27b   Qwen3.6-27B-Quark-W8A8  (tensor-parallel 2, :13313)
#   radiance-35b   Qwen3.6-35B-A3B-Quark    (tensor-parallel 2, :13313)
#   awq            AWQ models via vllm (single GPU, :13309)
#
# Setup (see README.md for details):
#   cp .env.example .env   # then set HF_TOKEN
#   docker compose --profile radiance-27b up -d   # pulls the prebuilt gfx1100 image
#
# The radiance profiles use the prebuilt image from ghcr.io — there is NO build
# step for them, deliberately: the gfx1100 image is produced by Dockerfile.gfx1100
# from the build/ adaptation layer (see AGENTS.md), not by this compose file.

networks:
  backend:
    driver: bridge
  backend-net:
    driver: bridge

services:
  # ── Radiance 27B Quark ──────────────────────────────────────────────────
  qwen-27b:
    profiles: ["radiance-27b"]
    image: ${RADIANCE_IMAGE:-ghcr.io/mkadrlik/vllm-radiance-p2p:gfx1100}
    container_name: qwen-27b
    restart: unless-stopped
    user: root
    ipc: host
    shm_size: ${VLLM_SHM_SIZE:-16G}
    privileged: true
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    networks:
      - backend
      - backend-net
    ports:
      - "${VLLM_HOST_PORT:-13313}:13313"
    command:
      - "nameistoken/Qwen3.6-27B-Quark-W8A8-INT8"
      - --served-model-name=qwen-27b
      - --quantization=quark
      - --tensor-parallel-size=${TENSOR_PARALLEL_SIZE:-2}
      - --gpu-memory-utilization=${VLLM_27B_GPU_MEM_UTIL:-0.85}
      - --max-model-len=${VLLM_27B_MAX_MODEL_LEN:-65537}
      - --max-num-batched-tokens=${VLLM_BATCH_TOKENS:-2048}
      - --max-num-seqs=${VLLM_MAX_SEQS:-64}
      - --dtype=bfloat16
      - --attention-backend=ROCM_ATTN
      - --enable-prefix-caching
      - '--compilation-config={"cudagraph_capture_sizes":[1,2,4,8,16,32,64,128],"max_cudagraph_capture_size":128}'
      - --no-async-scheduling
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - --language-model-only
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=13313
    environment:
      HIP_VISIBLE_DEVICES: "${HIP_VISIBLE_DEVICES:-0,1}"
      TZ: UTC
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_LINEAR: "1"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_MLA: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "0"
      VLLM_ROCM_USE_AITER_RMSNORM: "0"
      RADIANCE_GDN_WMMA: "0"
      RADIANCE_MOE_ROUTER: "1"
      RADIANCE_DYNAMIC_DRAFT: "1"
      RADIANCE_FAST_REDUCE: "0"
      RADIANCE_RUN_BWTEST: "0"
      RADIANCE_AR_QUANT: "0"
      RADIANCE_PRESHUFFLE: "0"
      RADIANCE_FUSE_RMS_QUANT: "0"
      RADIANCE_VIT_FLASH: "0"
      NCCL_PROTO: Simple
      GPU_MAX_HW_QUEUES: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "${TORCHINDUCTOR_COMPILE_THREADS:-4}"
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      AITER_ROOT_DIR: /cache/aiter
    volumes:
      - ./data/cache:/root/.cache/huggingface:rw
      - ./data/radiance-cache-27b-quark:/cache:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:13313/health"]
      interval: 30s
      timeout: 10s
      retries: ${VLLM_HEALTH_RETRIES:-10}
      start_period: ${VLLM_START_PERIOD:-1800}s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: qwen-27b

  # ── Radiance 35B-A3B Quark ──────────────────────────────────────────────
  qwen-35b:
    profiles: ["radiance-35b"]
    image: ${RADIANCE_IMAGE:-ghcr.io/mkadrlik/vllm-radiance-p2p:gfx1100}
    container_name: qwen-35b
    restart: unless-stopped
    user: root
    ipc: host
    shm_size: ${VLLM_SHM_SIZE:-16G}
    privileged: true
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    networks:
      - backend
      - backend-net
    ports:
      - "${VLLM_HOST_PORT:-13313}:13313"
    command:
      - "nameistoken/Qwen3.6-35B-A3B-Quark-W8A8-INT8"
      - --served-model-name=qwen-35b
      - --quantization=quark
      - --tensor-parallel-size=${TENSOR_PARALLEL_SIZE:-2}
      - --gpu-memory-utilization=${VLLM_35B_GPU_MEM_UTIL:-0.85}
      - --max-model-len=${VLLM_35B_MAX_MODEL_LEN:-32768}
      - --max-num-batched-tokens=${VLLM_BATCH_TOKENS:-2048}
      - --max-num-seqs=${VLLM_MAX_SEQS:-64}
      - --dtype=bfloat16
      - --attention-backend=ROCM_ATTN
      - --enable-prefix-caching
      - '--compilation-config={"cudagraph_capture_sizes":[1,2,4,8,16,32,64,128],"max_cudagraph_capture_size":128}'
      - --no-async-scheduling
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - --language-model-only
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=13313
    environment:
      HIP_VISIBLE_DEVICES: "${HIP_VISIBLE_DEVICES:-0,1}"
      TZ: UTC
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_LINEAR: "1"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_MLA: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "0"
      VLLM_ROCM_USE_AITER_RMSNORM: "0"
      RADIANCE_GDN_WMMA: "0"
      RADIANCE_MOE_ROUTER: "1"
      RADIANCE_DYNAMIC_DRAFT: "1"
      RADIANCE_FAST_REDUCE: "0"
      RADIANCE_RUN_BWTEST: "0"
      RADIANCE_AR_QUANT: "0"
      RADIANCE_PRESHUFFLE: "0"
      RADIANCE_FUSE_RMS_QUANT: "0"
      RADIANCE_VIT_FLASH: "0"
      NCCL_PROTO: Simple
      GPU_MAX_HW_QUEUES: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "${TORCHINDUCTOR_COMPILE_THREADS:-4}"
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      AITER_ROOT_DIR: /cache/aiter
    volumes:
      - ./data/cache:/root/.cache/huggingface:rw
      - ./data/radiance-cache-35b-a3b-quark:/cache:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:13313/health"]
      interval: 30s
      timeout: 10s
      retries: ${VLLM_HEALTH_RETRIES:-10}
      start_period: ${VLLM_START_PERIOD:-1800}s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: qwen-35b

  # ── AWQ (single GPU) ────────────────────────────────────────────────────
  # Built locally from Dockerfile.awq (thin layer on the public
  # vllm/vllm-openai-rocm:v0.24.0 image). First `up` builds it automatically.
  awq:
    profiles: ["awq"]
    build:
      context: .
      dockerfile: Dockerfile.awq
    image: ${AWQ_IMAGE:-vllm-radiance-p2p-awq:latest}
    container_name: vllm-awq
    restart: unless-stopped
    ipc: shareable
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    networks:
      - backend
    ports:
      - "${AWQ_HOST_PORT:-13309}:${AWQ_CONTAINER_PORT:-8001}"
    volumes:
      - ./data/awq-hf:/root/.cache/huggingface
      - ./data/awq-triton:/root/.triton:rw
    command: >
      ${AWQ_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct-AWQ}
      --port ${AWQ_CONTAINER_PORT:-8001}
      --host 0.0.0.0
      --served-model-name ${AWQ_SERVED_MODEL_NAME:-Qwen2.5-0.5B-Instruct}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.85}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --quantization ${QUANTIZATION:-awq}
      --trust-remote-code
      --enforce-eager
      --disable-log-stats
      ${VLLM_EXTRA_ARGS:-}
    environment:
      TZ: UTC
      GPU_ID: "${AWQ_GPU_ID:-0}"
      ROCR_VISIBLE_DEVICES: "${AWQ_GPU_ID:-0}"
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-11.0.0}"
      HSA_SIGNAL_TIMEOUT: "${HSA_SIGNAL_TIMEOUT:--1}"
      AMDGPU_GPU_RECOVERY: "${AMDGPU_GPU_RECOVERY:-1}"
      MODEL_NAME: "${AWQ_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct-AWQ}"
      SERVED_MODEL_NAME: "${AWQ_SERVED_MODEL_NAME:-}"
      QUANTIZATION: "${QUANTIZATION:-awq}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-32768}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.85}"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE:-1}"
      VLLM_EXTRA_ARGS: "${VLLM_EXTRA_ARGS:-}"
      VLLM_PORT: "${AWQ_CONTAINER_PORT:-8001}"
      HF_TOKEN: "${HF_TOKEN:-}"
    group_add:
      - video
      - render
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AWQ_CONTAINER_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: vllm-awq
