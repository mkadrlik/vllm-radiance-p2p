################################################################################
# vllm-rocm-tq — vLLM ROCm inference server for AWQ models on AMD RDNA3
#
# Based on vllm/vllm-openai-rocm:v0.24.0 (stable, ROCm 7.2.3, PyTorch 2.11+HIP).
# Eliminates custom wheels, sitecustomize patches, and Triton/gcc workarounds.
#
# Usage:
#   # Validate with small AWQ model (default, GPU0):
#   docker compose up -d
#
#   # Serve DiffusionGemma AWQ on GPU2:
#   GPU_ID=2 MODEL_NAME=pixelkaiser/diffusiongemma-26B-A4B-it-AWQ-MLP-W4A16-G64-S32-L1024 \
#     MAX_MODEL_LEN=4096 GPU_MEMORY_UTILIZATION=0.70 docker compose up -d
#
#   # Serve Ornith AWQ on GPU2:
#   GPU_ID=2 MODEL_NAME=cyankiwi/Ornith-1.0-9B-AWQ-INT4 \
#     SERVED_MODEL_NAME=Ornith-1.0-9B MAX_MODEL_LEN=32768 docker compose up -d
################################################################################
networks:
  gpu-node-net:
    external: true
  backend:
    driver: bridge

services:
  vllm-rocm-tq:
    image: ${VLLM_TQ_IMAGE:-ghcr.io/[username]/vllm-rocm-tq:latest}
    restart: unless-stopped
    ipc: shareable
    container_name: vllm-rocm-tq

    devices:
      - /dev/kfd
      - /dev/dri

    security_opt:
      - seccomp=unconfined

    networks:
      - backend
      - gpu-node-net

    ports:
      - "${VLLM_HOST_PORT:-13309}:${VLLM_PORT:-8001}"

    volumes:
      - ./data/hf-cache:/root/.cache/huggingface
      - ./data/triton-cache:/root/.triton:rw
      # Do NOT mount host /opt/rocm — the v0.24.0 image has its own ROCm 7.2.3.
      # Host ROCm libs require GLIBCXX_3.4.32 which the container doesn't have.

    environment:
      TZ: UTC
      # GPU selection — ROCR_VISIBLE_DEVICES set in entrypoint (avoids HIP/CUDA sync)
      GPU_ID: "${GPU_ID:-0}"
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      # Model config (all overridable)
      MODEL_NAME: "${MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct-AWQ}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-}"
      QUANTIZATION: "${QUANTIZATION:-awq}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-32768}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.85}"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE:-1}"
      VLLM_EXTRA_ARGS: "${VLLM_EXTRA_ARGS:-}"
      VLLM_PORT: "${VLLM_PORT:-8001}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HSA_SIGNAL_TIMEOUT: "-1"
      AMDGPU_GPU_RECOVERY: "1"

    group_add:
      - video
      - render

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: "vllm-rocm-tq"